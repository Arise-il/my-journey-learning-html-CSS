<!DOCTYPE html>
<html>
    <head>
        <title>display block and inline-block</title>
        <style>
          .text {
            display: inline-block;
            width: 200px;
          }
          .answer {
            display: inline-block;
            vertical-align: middle;
            margin-bottom: 30px;
            margin-right: 5px;

          }
        </style>
    </head>
    <body>
      <p class="text">
        Thanks for chatting with our customer support. would you like to take a quick servey
      </p>
      <button class="answer">
        yes
      </button>
      <button class="answer">
        no
      </button>
    </body>
</html>
