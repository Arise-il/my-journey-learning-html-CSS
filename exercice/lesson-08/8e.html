<!DOCTYPE html>
<html>
  <head>
    <title>uber request a ride form</title>
    <link rel="stylesheet" href="">

      .header {
        font-size: 50px;
        padding-top: 0px;

        margin-bottom: 20px;
        font-weight: 200;

      }
      .input {
        display: block;
        border: none;

        padding-top: 13px;
        padding-bottom: 13px;
        padding-left: 20px;
        background-color: rgb(231, 229, 229);

        color: white;

        margin-right: 20px;
        cursor: pointer;
      }
      .button2 {
        margin-top: 30px;
        border: none;

        padding: 18px 35px;

  <body>
    <p class="header">

    <input class="input" type="text" placeholder="Enter pickup location">
