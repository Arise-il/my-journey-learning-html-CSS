<!DOCTYPE html>
<html>
  <head>
    <title>sign up form</title>
    <style>
      .first_name , .last_name {
        width: 100px;
        font-size: 20px;
        margin-right: 1px;
        margin-left: 0px;
        padding: 8px 15px;
        border-style: solid;
        border-radius: 10px;
        border-width: 1px ;
        padding-right: 50px;
      }
      .email {
        display: block;
        width: 307px;
        margin-top: 10px;
        font-size: 20px;
        padding: 8px 15px;
        border-style: solid;
        border-radius: 10px;
        border-width: 1px ;
      }
      .action_button {
        width: 340px;
        border-style: solid;
        margin-top: 10px;
        border-radius: 10px;
        border: none;
        padding-top: 12px;
        padding-bottom: 12px;
        background-color: rgb(0, 119, 255);
        color: white;
        font-weight: bold;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <input class="first_name" type="text" placeholder="First name">
    <input class="last_name" type="text" placeholder="Last name">
    <input class="email" type="text" placeholder="Email">
    <button class="action_button">Sign up</button>
  </body>
</html>
